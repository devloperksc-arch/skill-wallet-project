# Secrets are NOT stored in this file. Create a `.env` file next to it (see .env.docker.example):
#   JWT_ACCESS_SECRET / JWT_REFRESH_SECRET  -> `openssl rand -hex 48`
#   MONGO_PASSWORD                          -> a strong password
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: staffsync-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://staffsync:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/staffsync?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COMPANY_TZ: ${COMPANY_TZ:-Asia/Kolkata}
      WORK_START: "09:30"
      LATE_GRACE_MINUTES: 15
      FULL_DAY_MINUTES: 480
      HALF_DAY_MINUTES: 240
      WEEKEND_DAYS: "0,6"
      LEAVE_BACKDATE_DAYS: 7
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:8
    container_name: staffsync-mongo
    restart: unless-stopped
    # No `ports:` — the database is reachable only from the app container, never from the host/network.
    environment:
      MONGO_INITDB_ROOT_USERNAME: staffsync
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mongo-data:
